<title>Range</title>

<style>
:root{--navy:#2d2a5e;--deep:#141331;--mist:#c9cff0;--line:rgba(201,207,240,.18)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--deep);color:#fff;font:16px/1.5 "Figtree",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(91,79,214,.32),transparent);top:-420px;right:-300px;pointer-events:none}
body::after{content:"";position:fixed;width:700px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,207,240,.10),transparent);bottom:-380px;left:-260px;pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:28px;padding:40px 32px 32px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.logo svg{height:22px;width:auto;display:block}
.k{font:700 10px "Syncopate",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mist);margin:36px 0 10px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0 0 8px;font-weight:700}
p{margin:0;color:var(--mist);font-size:15px}
form{display:grid;gap:10px;margin-top:26px}
label{font-size:13px;font-weight:600;color:var(--mist)}
input{font:16px "Figtree",sans-serif;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;outline:none;margin-top:6px}
input:focus{border-color:var(--mist);background:rgba(255,255,255,.09)}
button{margin-top:8px;font:600 16px "Figtree",sans-serif;background:#fff;color:var(--navy);border:0;border-radius:999px;padding:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--mist);outline-offset:2px}
.msg{min-height:20px;font-size:14px;color:#ffc4b8;margin-top:4px}
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:#9ea3c7;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:#9ea3c7}
</style>
</head>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function keyFrom(pass){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.iv)},key,b64(DATA.ct)));
  try{var raw=await crypto.subtle.exportKey("raw",key);sessionStorage.setItem("range.k",btoa(String.fromCharCode.apply(null,new Uint8Array(raw))))}catch(e){}
  document.open();document.write(html);document.close();
}
(async function(){
  try{var saved=sessionStorage.getItem("range.k");
    if(saved){var k=await crypto.subtle.importKey("raw",b64(saved),"AES-GCM",true,["decrypt"]);await open(k);return}}catch(e){try{sessionStorage.removeItem("range.k")}catch(_){}}
  var f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go");
  f.addEventListener("submit",async function(e){
    e.preventDefault();go.disabled=true;msg.textContent="";go.textContent="Opening…";
    try{await open(await keyFrom(document.getElementById("u").value.trim().toLowerCase()+":"+document.getElementById("p").value))}
    catch(err){msg.textContent="That username or password is not right.";go.disabled=false;go.textContent="Open the site"}
  });
})();
