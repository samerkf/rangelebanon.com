<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Range</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F9;--card:#fff;--ink:#1A1730;--muted:#5F5A78;--line:#E2DFEC;--violet:#5636D6;--soft:#ECE8FD}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#110F1A;--card:#1A1726;--ink:#ECEAF6;--muted:#A5A1BC;--line:#2E2A40;--violet:#8E78FF;--soft:#2A2350}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 24px;max-width:420px;width:100%;text-align:center}
.brand{font-weight:700;letter-spacing:.18em;font-size:18px;margin-bottom:14px}
h1{font-size:23px;line-height:1.25;margin:0 0 8px;text-wrap:balance}p{color:var(--muted);margin:0 0 18px}
.btn{display:block;background:var(--violet);color:#fff;font-weight:700;text-decoration:none;padding:14px;border-radius:12px;margin-top:10px}
.btn.alt{background:var(--soft);color:var(--violet)}
</style></head><body><div class="card">
<div class="brand">RANGE</div>
<h1 id="h">This page doesn't exist</h1>
<p id="p">The link may be old or mistyped.</p>
<a class="btn" id="open" href="/" hidden>Open in the Range app</a>
<a class="btn alt" id="get" href="/">Go to Range</a>
</div>
<script>
(function(){
  var m=location.pathname.match(/^\/(product|r|s)\/([A-Za-z0-9_-]{1,64})\/?$/);
  if(!m)return;
  var kind=m[1],code=m[2];
  var copy={product:["Someone shared a product with you","Open it in the Range app to see the price and order it."],
            r:["You're invited to Range","Join with this invite code: "+code],
            s:["Shop on Range","Open this shop in the Range app."]}[kind];
  document.title=copy[0]+" · Range";
  document.getElementById("h").textContent=copy[0];
  document.getElementById("p").textContent=copy[1];
  var open=document.getElementById("open");
  open.href="range://"+kind+"/"+encodeURIComponent(code);
  open.hidden=false;
  var get=document.getElementById("get");
  if(/Android/i.test(navigator.userAgent)){get.href="https://play.google.com/store/apps/details?id=com.range.customer";get.textContent="Get Range on Google Play";}
  else{get.href="/";get.textContent="Get Range";}
})();
</script></body></html>
